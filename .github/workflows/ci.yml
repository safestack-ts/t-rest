name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build-and-test:
    name: Build, Type Check & Test (Express ${{ matrix.express }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        express: ['4', '5']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The lockfile pins Express 5; overriding the major across the workspace checks the express peer range.
      # The lint job's frozen install keeps catching lockfile drift.
      - name: Pin Express ${{ matrix.express }}
        run: npm pkg set "pnpm.overrides.express=^${{ matrix.express }}" "pnpm.overrides.@types/express=^${{ matrix.express }}"
      - run: pnpm install --no-frozen-lockfile
      - name: Show resolved Express versions
        run: pnpm ls -r express @types/express --depth 0
      - name: Build
        run: pnpm build
      # Checks the built packages for undeclared dependencies, invalid exports and wrong types resolution.
      - name: Check Packages
        if: matrix.express == '5'
        run: pnpm check:packages
      # Type checks and tests resolve workspace packages through their built dist output, so they run after the build.
      - name: Type Check
        run: pnpm verify
      - name: Test
        run: pnpm test
        env:
          IS_CI: 'true'
